<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#f5f6f8" />
  <meta name="description" content="AI-powered PDF viewer using mistlib storage" />
  <title>PDF Viewer</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash. Light is default.
    (function () {
      try {
        var t = localStorage.getItem('tc-pdf-theme');
        var theme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
